name = "cw3"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CW6_complete_v2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "CW6_complete_v2"

[[lean_lib]]
name = "CW3_Backing"

[[lean_lib]]
name = "CW6_complete_v1"

[[lean_lib]]
name = "CW6_complete_v1_clean"
